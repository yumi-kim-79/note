name: sales_note
description: "영업 공유노트 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  table_calendar: ^3.2.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  firebase_storage: ^13.0.6
  firebase_auth: ^6.1.4
  pdf: ^3.11.3
  printing: ^5.14.2
  google_fonts: ^6.2.1
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  http: ^1.6.0
  # ✅ [추가] 국토부 API 데이터(XML) 처리를 위한 라이브러리 추가
  xml: ^6.5.0
  excel: ^4.0.6
  flutter_naver_map: any
  universal_html: ^2.3.0
  js: ^0.7.2
  file_picker: ^10.3.10
  flutter_image_compress: ^2.1.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^17.0.0
  googleapis_auth: ^2.0.0
  vibration: ^1.9.0
  cp949_codec: ^1.0.2
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # ✅ [유지] 아이콘 생성 도구
  flutter_launcher_icons: "^0.13.1"

# ✅ [유지] 아이콘 상세 설정
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#F5F7FA"
    theme_color: "#F5F7FA"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/sm_logo.png
    - assets/images/app_icon.png
    - assets/service-account.json
    - assets/fire_images/  # 🌟 [여기 수정!] fire_images