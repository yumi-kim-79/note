name: sales_note
description: "영업 공유노트 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  table_calendar: ^3.2.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  firebase_storage: ^13.0.6
  firebase_auth: ^6.1.4
  pdf: ^3.11.1
  printing: ^5.14.0
  google_fonts: ^6.2.1
