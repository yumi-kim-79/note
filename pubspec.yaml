  universal_html: ^2.3.0
  js: ^0.7.2
  file_picker: ^10.3.10
  flutter_image_compress: ^2.1.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^17.0.0
  googleapis_auth: ^2.0.0
  vibration: ^1.9.0

dev_dependencies:
