<!DOCTYPE html>
<html>
<head>
    <meta name="referrer" content="origin">
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="영업 공유노트 앱">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SM Service Management">

    <title>SM Service Management</title>
    <link rel="manifest" href="manifest.json">

    <script>
        window.flutterWebRenderer = "html";
    </script>

    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=s9qk2rcdyp"></script>

    <style>
        body {
            background-color: #F5F7FA;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .loading-container {
            text-align: center;
        }
        .loader {
            border: 5px solid #e0e0e0;
            border-top: 5px solid #2C3E50;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        .loading-text {
            color: #2C3E50;
            font-size: 16px;
            font-weight: bold;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="loading-container">
    <div class="loader"></div>
    <div class="loading-text">SM Service Management<br>로딩 중...</div>
</div>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
