<!DOCTYPE html>
<html>
<head>
    <meta name="referrer" content="origin">
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="스마트한 현장 관리 및 영업 공유 플랫폼, SM_Note">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F5F7FA">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SM Note">

    <title>SM Note</title>
    <link rel="manifest" href="manifest.json">

    <script>
        window.flutterWebRenderer = "html";
    </script>

    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=s9qk2rcdyp"></script>

    <style>
        body {
            background-color: #F5F7FA !important; /* 배경색 강제 고정 */
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* ✅ [고도화] 최상단 레이어 - 어떤 상황에서도 2초간 노출 강제 */
        .loading-container {
            position: fixed !important;
            top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 2147483647 !important;
            background-color: #F5F7FA !important;
            display: flex !important;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s ease-in-out; /* 사라질 때 부드럽게 */
        }

        .loading-container.hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .loading-logo {
            width: 50%;
            max-width: 350px;
            min-width: 150px;
            height: auto;
            margin-bottom: 30px;

            /* 🔥 3초 동안 아주 천천히, 부드럽게 움직이도록 설정 */
            animation: zoomIn 3s ease-in-out infinite;

            /* ✅ [깜빡임 방지 핵심] GPU 가속 강제 활성화 */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            will-change: transform, opacity;
        }

        .loading-text {
            color: #2C3E50;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        @keyframes zoomIn {
            0% {
                opacity: 0;
                transform: scale(0.75); /* 기본 세팅: 75%에서 시작 */
            }
            50% {
                opacity: 1;             /* 중간에 가장 선명함 */
            }
            100% {
                opacity: 0;
                transform: scale(1.0);  /* 25%만큼 더 커진 100%에서 마무리 */
            }
        }
    </style>
</head>
<body>
<div id="loading" class="loading-container">
    <img src="sm_logo.png" class="loading-logo" alt="SM Logo">
    <div class="loading-text">SM Note<br>시스템 접속 중...</div>
</div>



<script>
    // ✅ [고도화] 어떤 환경에서도 무조건 2초(2000ms)는 보여주는 하드락 스크립트
    (function() {
        var flutterReady = false;
        var minTimePassed = false;
        var loadingRemoved = false;
        var loadingElement = document.getElementById('loading');

        // 1. 페이지 로드 즉시 2초 타이머 작동
        setTimeout(function() {
            minTimePassed = true;
            attemptRemoval();
        }, 2000);

        // 2. 플러터 엔진 준비 완료 신호 수신
        window.addEventListener('flutter-first-frame', function() {
            flutterReady = true;
            attemptRemoval();
        });

        function attemptRemoval() {
            // 2초 경과 + 플러터 준비 완료가 모두 충족되어야 삭제
            if (flutterReady && minTimePassed && !loadingRemoved) {
                loadingRemoved = true;
                if (loadingElement) {
                    loadingElement.style.opacity = '0'; // 부드럽게 사라지기
                    setTimeout(function() {
                        loadingElement.remove();
                    }, 800);
                }
            }
        }
    })();
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
