<!DOCTYPE html>
<html>
<head>
    <meta name="referrer" content="origin">
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="스마트한 현장 관리 및 영업 공유 플랫폼, SM_Note">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F5F7FA">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SM Note">

    <title>SM Note</title>
    <link rel="manifest" href="manifest.json">

    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=s9qk2rcdyp"></script>

    <style>
        body {
            background-color: #F5F7FA !important;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .loading-container {
            position: fixed !important;
            top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 2147483647 !important;
            background-color: #F5F7FA !important;
            display: flex !important;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s ease-in-out;
        }

        .loading-container.hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .loading-logo {
            width: 50%;
            max-width: 350px;
            min-width: 150px;
            height: auto;
            margin-bottom: 30px;
            animation: zoomIn 3s ease-in-out infinite;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            will-change: transform, opacity;
        }

        .loading-text {
            color: #2C3E50;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        @keyframes zoomIn {
            0% { opacity: 0; transform: scale(0.75); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.0); }
        }
    </style>
</head>
<body>
<div id="loading" class="loading-container">
    <img src="sm_logo.png" class="loading-logo" alt="SM Logo">
    <div class="loading-text">SM Note<br>시스템 접속 중...</div>
</div>

<script>
    (function() {
        var flutterReady = false;
        var minTimePassed = false;
        var loadingRemoved = false;
        var loadingElement = document.getElementById('loading');

        setTimeout(function() {
            minTimePassed = true;
            attemptRemoval();
        }, 2000);

        window.addEventListener('flutter-first-frame', function() {
            flutterReady = true;
            attemptRemoval();
        });

        function attemptRemoval() {
            if (flutterReady && minTimePassed && !loadingRemoved) {
                loadingRemoved = true;
                if (loadingElement) {
                    loadingElement.style.opacity = '0';
                    setTimeout(function() {
                        loadingElement.remove();
                    }, 800);
                }
            }
        }
    })();
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            // ⚠️ 파이어베이스와의 충돌(이중 등록)을 막기 위해 정석대로 호출합니다.
            navigator.serviceWorker.register('/firebase-messaging-sw.js').then(function (registration) {
                console.log('[SW] 서비스 워커 등록 성공:', registration.scope);
                registration.update(); // 브라우저 자체 기능으로 캐시를 무시하고 즉시 최신화합니다.
            });
        });
    }
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
